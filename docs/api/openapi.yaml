                          $ref: '#/components/schemas/AuditLogEntry'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/tokens:
    get:
      tags: [tokens]
      operationId: listApiTokens
      summary: List personal API tokens
      x-status: pending
      x-ticket: RY-028
      x-permission: project:read
      responses:
        '200':
          description: Target response once RY-028 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [tokens]
      operationId: createApiToken
      summary: Create a personal API token
      x-status: pending
      x-ticket: RY-028
      x-permission: project:read
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        '201':
          description: Target response once RY-028 lands; the secret is returned exactly once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ApiToken'
                          - type: object
                            properties:
                              token:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: In-app notifications
      x-status: pending
      x-ticket: RY-130
      x-permission: project:read
      responses:
        '200':
          description: Target response once RY-130 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ry_session
      description: |
        Opaque 256-bit random token set as an HttpOnly, SameSite=Lax cookie (Secure when
        COOKIE_SECURE=true). The database stores only HMAC-SHA256(SESSION_SECRET, token) as the session id.
        Lifetime SESSION_TTL_HOURS (default 168).
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: |
        Required on every authenticated POST, PUT, PATCH and DELETE. Must equal the CSRF token bound to
        the session, which is returned as `data.csrfToken` by register, login and `GET /api/auth/me`, and
        mirrored in the non-HttpOnly `ry_csrf` cookie.

  headers:
    SessionCookies:
      description: |
        Two cookies, both `Path=/; SameSite=Lax` with the session expiry: `ry_session=<token>; HttpOnly`
        and `ry_csrf=<csrf token>` (readable by the web app).
      schema:
        type: string
    RetryAfter:
      description: Seconds until another attempt is allowed.
      schema:
        type: integer

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: Project id
      schema:
        type: string
        format: uuid
    RunId:
      name: id
      in: path
      required: true
      description: Run id
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Window:
      name: window
      in: query
      required: false
      description: Aggregation window
      schema:
        type: string
        enum: [1h, 24h, 7d, 30d]
        default: 24h

  responses:
    ValidationFailed:
      description: |
        `VALIDATION_FAILED` (zod) with `details` = list of `{path, message}`; or `BAD_REQUEST` for
        malformed JSON and other framework-level request errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              details:
                - path: password
                  message: password must be at least 12 characters
    Unauthenticated:
      description: No session cookie, or the session is unknown, expired or belongs to a disabled user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: UNAUTHENTICATED
              message: Authentication required
    Forbidden:
      description: |
        `FORBIDDEN` when the role lacks the permission in `x-permission`, or `CSRF_FAILED` when a
        mutating request has a missing or wrong `x-csrf-token`. CSRF is checked before the permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                data: null
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action
            csrf:
              value:
                data: null
                error:
                  code: CSRF_FAILED
                  message: Missing or invalid CSRF token
    NotFound:
      description: Resource does not exist or belongs to another organization (indistinguishable by design).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_FOUND
              message: Project not found
    Conflict:
      description: Uniqueness violation, e.g. duplicate project slug within the organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: CONFLICT
              message: "Project slug 'storefront' is already in use"
    PayloadTooLarge:
      description: Request body above the 512 KiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body is too large
    RateLimited:
      description: Throttled. `Retry-After` and `details.retryAfterSeconds` carry the wait.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: RATE_LIMITED
              message: Too many attempts, try again later
              details:
                retryAfterSeconds: 60
    NotImplemented:
      description: Planned operation, not implemented yet. `details.ticket` names the backlog ticket.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotImplementedEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Cancel a run is planned but not implemented yet
              details:
                ticket: RY-043

  schemas:
    EnvelopeOk:
      type: object
      required: [data, error]
      properties:
        data:
          description: Operation payload
        error:
          type: 'null'
        meta:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
    NotImplementedEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              const: NOT_IMPLEMENTED
            message:
              type: string
            details:
              type: object
              required: [ticket]
              properties:
                ticket:
                  type: string
                  pattern: '^RY-\d{3}$'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, safe to show to users; never contains secrets or stack traces.
        details:
          description: Code-specific structured detail (field errors, issues, retryAfterSeconds, ticket).
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_FAILED
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - PIPELINE_INVALID
        - EMPTY_PLAN
        - RATE_LIMITED
        - INTERNAL
        - NOT_IMPLEMENTED
        - NOT_READY
    CursorMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next (older) page; null on the last page.
        limit:
          type: integer
    LogMeta:
      type: object
      required: [lastSeq, jobStatus, complete]
      properties:
        lastSeq:
          type: integer
          description: Highest seq returned, or the `after` value when no chunk was returned.
        jobStatus:
          $ref: '#/components/schemas/JobStatus'
        complete:
          type: boolean

    Health:
      type: object
      required: [status, version, uptimeSeconds]
      properties:
        status:
          const: ok
        version:
          type: string
          examples: ['0.1.0']
        uptimeSeconds:
          type: integer
    Readiness:
      type: object
      required: [status, database, queuedJobs, onlineRunners]
      properties:
        status:
          const: ready
        database:
          const: up
        queuedJobs:
          type: integer
          description: Jobs in status `queued` across all organizations.
        onlineRunners:
          type: integer
          description: Runners with `last_heartbeat_at` within the last minute.

    Role:
      type: string
      enum: [owner, admin, developer, viewer]
    RegisterRequest:
      type: object
      required: [organizationName, organizationSlug, name, email, password]
      additionalProperties: false
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 100
        organizationSlug:
          type: string
          description: Trimmed and lower-cased before validation.
          pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased.
        password:
          type: string
          minLength: 12
          maxLength: 256
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    Principal:
      type: object
      required: [user, organization, role, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            name:
              type: string
        organization:
          type: object
          required: [id, name, slug]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        csrfToken:
          type: string
          description: Send as `x-csrf-token` on mutating requests.

    Project:
      type: object
      required: [id, name, slug, repositoryPath, defaultBranch, createdAt, lastRun]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        repositoryPath:
          type: string
          description: Absolute path of the bare git repository on the Railyard host.
          examples: [/srv/git/storefront.git]
        defaultBranch:
          type: string
        createdAt:
          type: string
          format: date-time
        lastRun:
          oneOf:
            - type: 'null'
            - type: object
              required: [number, status, createdAt]
              properties:
                number:
                  type: integer
                status:
                  $ref: '#/components/schemas/RunStatus'
                createdAt:
                  type: string
                  format: date-time
    CreateProjectRequest:
      type: object
      required: [name, slug, repositoryPath]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
        repositoryPath:
          type: string
          minLength: 1
          maxLength: 1024
          description: Must be absolute (start with `/`).
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
          default: main
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        repositoryPath:
          type: string
          maxLength: 1024

    TriggerEvent:
      type: string
      enum: [push, manual, schedule, api]
    ValidatePipelineRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          minLength: 1
          maxLength: 262144
          description: Pipeline definition (`.railyard.yml` content), at most 256 KiB.
        context:
          type: object
          properties:
            branch:
              type: string
              pattern: '^[A-Za-z0-9._/-]+$'
              maxLength: 255
              default: main
            sha:
              type: string
              pattern: '^[0-9a-fA-F]{7,40}$'
              default: '0000000'
            event:
              $ref: '#/components/schemas/TriggerEvent'
    CreateRunRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          minLength: 1
          maxLength: 262144
        branch:
          type: string
          pattern: '^[A-Za-z0-9._/-]+$'
          maxLength: 255
          default: main
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{7,40}$'
          default: '0000000'
        event:
          type: string
          enum: [manual, api]
          default: manual
    PipelineIssue:
      type: object
      required: [severity, code, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
          description: |
            Stable machine code. Current values: yaml_syntax, duplicate, unsupported_version, unknown_key,
            required, type, enum, pattern, range, empty, too_long, too_many, unknown_stage, unknown_job,
            self_dependency, later_stage, cycle, empty_matrix, unknown_axis, unknown_reference,
            expression_syntax, invalid_cron, unsafe_path, plan_too_large, not_yet_executed (warning).
        path:
          type: string
          description: Dotted/indexed path into the document, `$` for the root.
          examples: ['jobs.unit.matrix.node[2]']
        message:
          type: string
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
    PlanPreview:
      type: object
      required: [valid, issues, plan]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PipelineIssue'
        plan:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ExecutionPlan'
    ExecutionPlan:
      type: object
      required: [pipelineName, stages, jobs, levels, excluded, criticalPath]
      properties:
        pipelineName:
          type: string
        stages:
          type: array
          items:
            type: string
        jobs:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PlannedJob'
        levels:
          type: array
          description: Topological levels; each inner array lists job keys that may run in parallel.
          items:
            type: array
            items:
              type: string
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedJob'
        criticalPath:
          type: array
          description: Job keys on the longest dependency chain.
          items:
            type: string
    PlannedJob:
      type: object
      required:
        [
          key,
          jobId,
          name,
          stage,
          stageIndex,
          matrix,
          needs,
          level,
          when,
          allowFailure,
          timeoutSeconds,
          retries,
          runsOn,
          env,
          steps,
        ]
      properties:
        key:
          type: string
          description: Unique within the run; matrix instances get a suffixed key.
          examples: ['unit-node-22-shard-1']
        jobId:
          type: string
          description: Job id as written in the YAML.
        name:
          type: string
        stage:
          type: string
        stageIndex:
          type: integer
        matrix:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ScalarMap'
        needs:
          type: array
          items:
            type: string
        level:
          type: integer
          minimum: 0
        when:
          $ref: '#/components/schemas/JobWhen'
        allowFailure:
          type: boolean
        timeoutSeconds:
          type: integer
        retries:
          type: integer
          minimum: 0
          maximum: 5
        runsOn:
          type: array
          items:
            type: string
        env:
          $ref: '#/components/schemas/StringMap'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlannedStep'
    PlannedStep:
      type: object
      required: [index, name, run, env, timeoutSeconds, continueOnError, workingDirectory]
      properties:
        index:
          type: integer
        name:
          type: string
        run:
          type: string
          description: Interpolated shell script.
        env:
          $ref: '#/components/schemas/StringMap'
        timeoutSeconds:
          type: integer
        continueOnError:
          type: boolean
        workingDirectory:
          type: [string, 'null']
    ExcludedJob:
      type: object
      required: [jobId, reason]
      properties:
        jobId:
          type: string
        reason:
          type: string
    JobWhen:
      type: string
      enum: [on_success, on_failure, always]
    ScalarMap:
      type: object
      additionalProperties:
        type: [string, number, boolean]
    StringMap:
      type: object
      additionalProperties:
        type: string

    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobStatus:
      type: string
      enum: [blocked, queued, running, succeeded, failed, timed_out, cancelled, skipped]
    StepStatus:
      type: string
      enum: [pending, running, succeeded, failed, timed_out, skipped, cancelled]
    RunSummary:
      type: object
      required:
        [
          id,
          projectId,
          number,
          status,
          pipelineName,
          branch,
          commitSha,
          triggerEvent,
          createdAt,
          startedAt,
          finishedAt,
          jobCounts,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RunStatus'
        pipelineName:
          type: string
        branch:
          type: string
        commitSha:
          type: string
        triggerEvent:
          $ref: '#/components/schemas/TriggerEvent'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        jobCounts:
          type: object
          description: Number of jobs per JobStatus (statuses with zero jobs are omitted).
          additionalProperties:
            type: integer
          examples:
            - succeeded: 4
              running: 1
              blocked: 2
    Run:
      $ref: '#/components/schemas/RunDetail'
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [stages, criticalPath, excluded, jobs]
          properties:
            stages:
              type: array
              items:
                type: string
            criticalPath:
              type: array
              items:
                type: string
            excluded:
              type: array
              items:
                $ref: '#/components/schemas/ExcludedJob'
            jobs:
              type: array
              description: Ordered by level, stage index, creation time and key.
              items:
                $ref: '#/components/schemas/Job'
    Job:
      type: object
      required:
        [
          id,
          key,
          jobRef,
          name,
          stage,
          stageIndex,
          level,
          matrix,
          needs,
          when,
          allowFailure,
          status,
          attempt,
          retries,
          exitCode,
          failureReason,
          queuedAt,
          startedAt,
          finishedAt,
          steps,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        jobRef:
          type: string
          description: Job id from the YAML (shared by all matrix instances).
        name:
          type: string
        stage:
          type: string
        stageIndex:
          type: integer
        level:
          type: integer
        matrix:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ScalarMap'
        needs:
          type: array
          items:
            type: string
        when:
          $ref: '#/components/schemas/JobWhen'
        allowFailure:
          type: boolean
        status:
          $ref: '#/components/schemas/JobStatus'
        attempt:
          type: integer
          description: Attempts started so far (0 before the first lease).
        retries:
          type: integer
        exitCode:
          type: [integer, 'null']
        failureReason:
          type: [string, 'null']
          examples: ["step 'run tests' failed", 'lease expired (runner lost)', 'job timeout']
        queuedAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
    Step:
      type: object
      required: [id, position, name, status, exitCode, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/StepStatus'
        exitCode:
          type: [integer, 'null']
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    LogChunk:
      type: object
      required: [seq, attempt, stream, content, createdAt]
      properties:
        seq:
          type: integer
          minimum: 1
        attempt:
          type: integer
        stream:
          type: string
          enum: [stdout, stderr, system]
        content:
          type: string
          description: Raw text including ANSI SGR escapes; known secrets already replaced by `***`.
        createdAt:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        name:
          type: string
        headSha:
          type: string
        updatedAt:
          type: string
          format: date-time
    Commit:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        author:
          type: string
        committedAt:
          type: string
          format: date-time
    PipelineFile:
      type: object
      properties:
        ref:
          type: string
        sha:
          type: string
        path:
          const: .railyard.yml
        yaml:
          type: string
    SecretMetadata:
      type: object
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [organization, project, environment]
        keyVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    PutSecretRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 4
          maxLength: 65536
          writeOnly: true
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        name:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        expiresAt:
          type: string
          format: date-time
    Environment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        requiredReviewers:
          type: integer
        allowedBranches:
          type: array
          items:
            type: string
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_-]{0,62}$'
        requiredReviewers:
          type: integer
          minimum: 0
          default: 0
        allowedBranches:
          type: array
          items:
            type: string
    Deployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
        runId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        commitSha:
          type: string
        status:
          type: string
          enum: [in_progress, succeeded, failed, rolled_back]
        createdAt:
          type: string
          format: date-time
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        environment:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        requestedAt:
          type: string
          format: date-time
    ApprovalDecisionRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cron:
          type: string
          examples: ['0 3 * * 1-5']
        timezone:
          type: string
          default: UTC
        branch:
          type: string
        paused:
          type: boolean
        nextRunAt:
          type: [string, 'null']
          format: date-time
    CreateScheduleRequest:
      type: object
      required: [cron, branch]
      properties:
        cron:
          type: string
        branch:
          type: string
        timezone:
          type: string
          default: UTC
    Runner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        labels:
          type: array
          items:
            type: string
        version:
          type: string
        status:
          type: string
          enum: [online, offline]
        lastHeartbeatAt:
          type: string
          format: date-time
        currentJobId:
          type: [string, 'null']
          format: uuid
    RegistrationToken:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    QueueMetrics:
      type: object
      properties:
        queuedJobs:
          type: integer
        runningJobs:
          type: integer
        waitSeconds:
          $ref: '#/components/schemas/Percentiles'
    ProjectMetrics:
      type: object
      properties:
        runs:
          type: integer
        successRate:
          type: number
          minimum: 0
          maximum: 1
        durationSeconds:
          $ref: '#/components/schemas/Percentiles'
    Percentiles:
      type: object
      properties:
        p50:
          type: number
        p90:
          type: number
        p99:
          type: number
    Member:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    InvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          examples:
            [
              auth.login,
              auth.login_failed,
              auth.registered,
              auth.logout,
              project.created,
              run.created,
            ]
        actorUserId:
          type: [string, 'null']
          format: uuid
        targetType:
          type: [string, 'null']
        targetId:
          type: [string, 'null']
        metadata:
          type: object
        requestId:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First characters of the token, for identification.
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [run_failed, approval_requested, queue_slo_breached]
        runId:
          type: [string, 'null']
          format: uuid
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
