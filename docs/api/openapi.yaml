  /api/runs/{id}/jobs/{jobId}/logs:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [logs]
      operationId: getJobLogs
      summary: Fetch persisted log chunks after a sequence number
      description: |
        Chunks are ordered by `seq` (strictly increasing per job, continuous across retry attempts).
        Poll with `after=meta.lastSeq` until `meta.complete` is true. `complete` is true only when the
        job is terminal and fewer than `limit` chunks were returned.
      x-status: implemented
      x-permission: run:read
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
      responses:
        '200':
          description: Log chunks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LogChunk'
                      meta:
                        $ref: '#/components/schemas/LogMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}/jobs/{jobId}/logs/stream:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [logs]
      operationId: streamJobLogs
      summary: Live log stream (Server-Sent Events)
      description: |
        `text/event-stream`. The server first sends `retry: 2000`, then back-fills every chunk with
        `seq > resume point`, then streams new chunks as `railyard_logs` notifications arrive. Events:

        - `event: log`, `id: <seq>`, `data: {"seq":N,"stream":"stdout|stderr|system","content":"..."}`
        - `event: status`, `data: {"status":"<JobStatus>"}`; sent once at connect and on every job transition
        - `event: end`, `data: {}`; sent after a terminal status, then the server closes the stream

        A comment line `: keep-alive` is written every 15 s. Resume point: the `Last-Event-ID` header
        (set automatically by EventSource on reconnect) wins over the `after` query parameter.
        Authentication and tenant checks happen before the stream opens, so failures are ordinary JSON
        error envelopes.
      x-status: implemented
      x-permission: run:read
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Sequence number of the last `log` event received.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Event stream
          headers:
            X-Accel-Buffering:
              description: Always `no`, so nginx does not buffer the stream.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 2000

                event: log
                id: 1
                data: {"seq":1,"stream":"system","content":"[railyard] compile - attempt 1 on runner-a\n"}

                event: status
                data: {"status":"running"}

                event: log
                id: 2
                data: {"seq":2,"stream":"stdout","content":"bundle chunk 1\n"}

                event: status
                data: {"status":"succeeded"}

                event: end
                data: {}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

