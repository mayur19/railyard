openapi: 3.1.0
info:
  title: Railyard API
  version: 0.1.0
  summary: Self-hosted CI/CD pipeline orchestrator.
  description: |
    Full target HTTP API of Railyard. Every operation carries `x-status`:

    - `implemented`: served by `apps/api` today and covered by the integration suites in `apps/api/test`.
    - `pending`: the route is registered (authenticated, authorised and CSRF-checked exactly like a real
      route) but answers `501 NOT_IMPLEMENTED` with `error.details.ticket` set to the backlog ticket in
      `x-ticket`. Request and success-response shapes documented for pending operations are the target
      contract and may still change before the ticket lands.

    All JSON responses use the envelope `{ data, error, meta? }`. See `docs/api/README.md` for
    conventions, error codes, pagination, the auth/CSRF flow and curl examples.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4105
    description: Local development API (API_HOST/API_PORT defaults)
  - url: https://ci.example.internal
    description: Typical production deployment behind nginx (same origin as the web UI)
tags:
  - name: health
  - name: auth
  - name: projects
  - name: pipelines
  - name: runs
  - name: logs
  - name: secrets
  - name: artifacts
  - name: environments
  - name: approvals
  - name: schedules
  - name: runners
  - name: metrics
  - name: organization
  - name: audit
  - name: tokens
  - name: notifications
security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      description: Process is up. Does not touch the database.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'

  /api/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe
      description: |
        Runs one query against Postgres and reports queue depth and the number of runners whose
        `runners.last_heartbeat_at` is within the last minute. Returns 503 when the database is unreachable.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Readiness'
        '503':
          description: Database unavailable (`error.code` = `NOT_READY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register an organization and its owner
      description: |
        Creates an organization, a user with role `owner`, a session, and an `auth.registered` audit
        entry in one transaction. Rate-limited per client IP (REGISTER_RATE_LIMIT per
        REGISTER_RATE_WINDOW_SECONDS); the limiter is consulted before validation, so malformed attempts
        count too. "Email already registered" and "organization slug taken" both produce the same
        generic 409 so the endpoint cannot be used to enumerate accounts. Email-verified signup with a
        uniform 202 is planned in RY-150.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Organization, owner and session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Generic rejection; identical for duplicate email and duplicate slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                error:
                  code: CONFLICT
                  message: Registration could not be completed with the supplied details
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Three throttles apply, in this order, after body validation and before the password is verified.
        All decisions are taken synchronously before the first await. Keys use the normalised client IP
        (IPv4-mapped IPv6 becomes IPv4; other IPv6 collapses to its /64).

        1. Per client IP, fixed window: at most LOGIN_IP_RATE_LIMIT attempts (successful or not) per
           LOGIN_RATE_WINDOW_SECONDS. Stops password spraying across many accounts from one address.
        2. Distinct emails per client IP: at most LOGIN_MAX_EMAILS_PER_IP different emails per
           LOGIN_RATE_WINDOW_SECONDS. Stops account cycling and flooding of the per-email store.
        3. Per normalised email, progressive backoff: each attempt is reserved (counted as a failure) up
           front and reset on success. The first LOGIN_EMAIL_FREE_ATTEMPTS failures are free, then each
           further failure locks the email for LOGIN_BACKOFF_BASE_SECONDS x 2^(n-1), capped at
           LOGIN_BACKOFF_MAX_SECONDS. Stops credential stuffing against one account from many IPs.

        Unknown users and wrong passwords both return `401 INVALID_CREDENTIALS`, and scrypt runs against
        a dummy hash for unknown users so timing does not reveal account existence.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: owner@railyard.local
              password: railyard-demo-pass
      responses:
        '200':
          description: Session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong email or password (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: Deletes the session row, writes `auth.logout` to the audit log and clears both cookies.
      x-status: implemented
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Logged out (no body)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current principal
      description: Returns the user, organization, role and the CSRF token bound to the session.
      x-status: implemented
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects of the caller's organization
      description: Ordered by name. Each project carries a summary of its most recent run.
      x-status: implemented
      x-permission: project:read
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      description: Writes a `project.created` audit entry. Slugs are unique per organization.
      x-status: implemented
      x-permission: project:write
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Get one project
      x-status: implemented
      x-permission: project:read
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Update project settings
      x-status: pending
      x-ticket: RY-011
      x-permission: project:write
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Target response once RY-011 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Archive or delete a project
      description: Target behaviour archives by default; `?purge=true` deletes runs, logs and artifacts.
      x-status: pending
      x-ticket: RY-011
      x-permission: project:write
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: purge
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Target response once RY-011 lands
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/projects/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: syncProject
      summary: Poll the bare repository now
      x-status: pending
      x-ticket: RY-012
      x-permission: project:write
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Target response once RY-012 lands; returns the refs that changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          changedRefs:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/projects/{id}/branches:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: listBranches
      summary: List branches and head commits
      x-status: pending
      x-ticket: RY-013
      x-permission: project:read
      responses:
        '200':
          description: Target response once RY-013 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/projects/{id}/commits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: listCommits
      summary: List commits for a branch
      x-status: pending
      x-ticket: RY-013
      x-permission: project:read
      parameters:
        - name: branch
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Commit SHA to continue after
      responses:
        '200':
          description: Target response once RY-013 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Commit'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/projects/{id}/pipeline-file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getPipelineFile
      summary: Read .railyard.yml at a commit
      x-status: pending
      x-ticket: RY-014
      x-permission: project:read
      parameters:
        - name: ref
          in: query
          required: false
          description: Branch name or commit SHA; defaults to the project's default branch.
          schema:
            type: string
      responses:
        '200':
          description: Target response once RY-014 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PipelineFile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/pipelines/validate:
    post:
      tags: [pipelines]
      operationId: validatePipeline
      summary: Validate a pipeline definition and preview its execution plan
      description: |
        Side-effect free: parses the YAML, runs the schema validator, and when valid compiles an
        execution plan for the supplied context (branch, sha, event) with `run_number` = 0.
        Always answers 200 for well-formed requests; `data.valid` tells whether the pipeline is usable.
        Issues carry a JSON-path style `path` and, when known, `line` and `column`. Plans that exceed
        the planned-job limit (1000) are returned as invalid with code `plan_too_large`.
        Being a POST, it still requires the CSRF header.
      x-status: implemented
      x-permission: pipeline:validate
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePipelineRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/projects/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a run from a pipeline definition
      description: |
        In one transaction: reserves the next run number (row lock on the project serialises concurrent
        requests), validates and plans the YAML, inserts the run, its jobs and steps, writes a
        `run.created` audit entry and issues a `railyard_jobs` NOTIFY. Jobs without dependencies start
        `queued`; all others start `blocked`.
      x-status: implemented
      x-permission: run:create
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: |
            `PIPELINE_INVALID` (details.issues holds PipelineIssue[]) or `EMPTY_PLAN` (no job survives
            conditions for this branch/event; details.excluded holds ExcludedJob[]).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid:
                  value:
                    data: null
                    error:
                      code: PIPELINE_INVALID
                      message: Pipeline definition is invalid
                      details:
                        issues:
                          - severity: error
                            code: unknown_job
                            path: jobs.test.needs[0]
                            message: "needs references unknown job 'buld'"
                            line: 9
                            column: 13
                empty:
                  value:
                    data: null
                    error:
                      code: EMPTY_PLAN
                      message: No jobs match this branch and event
                      details:
                        excluded:
                          - jobId: deploy
                            reason: "condition false: branch == 'main'"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs of a project (newest first, cursor paginated)
      description: |
        Keyset pagination on the run number. `meta.nextCursor` is the number of the last run on the page
        (as a string) or null on the last page; pass it back as `cursor` to fetch older runs.
      x-status: implemented
      x-permission: run:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          description: Return runs with a number strictly lower than this value.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RunSummary'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      operationId: getRun
      summary: Run detail with jobs, steps, stages and critical path
      x-status: implemented
      x-permission: run:read
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run
      x-status: pending
      x-ticket: RY-043
      x-permission: run:cancel
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Target response once RY-043 lands; running jobs are signalled, blocked/queued jobs cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/runs/{id}/rerun:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [runs]
      operationId: rerunPipeline
      summary: Re-run a pipeline with the same inputs
      x-status: pending
      x-ticket: RY-044
      x-permission: run:create
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '201':
          description: Target response once RY-044 lands; a new run with the same YAML, branch, sha and event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/runs/{id}/jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [runs]
      operationId: cancelJob
      summary: Cancel one job
      x-status: pending
      x-ticket: RY-043
      x-permission: run:cancel
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Target response once RY-043 lands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/runs/{id}/jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [runs]
      operationId: retryJob
      summary: Retry a failed job
      x-status: pending
      x-ticket: RY-044
      x-permission: run:create
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Target response once RY-044 lands; the job is requeued and skipped dependents re-blocked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
