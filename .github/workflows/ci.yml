name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://railyard:railyard-ci-only@localhost:5432/railyard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start the runner's preinstalled PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE railyard LOGIN PASSWORD 'railyard-ci-only' CREATEDB"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE railyard_test OWNER railyard"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
